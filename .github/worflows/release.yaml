name: Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install System Dependencies (GTK4 & Libadwaita)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libsqlite3-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binaries
        run: cargo build --workspace --release

      - name: Package Binaries
        run: |
          mkdir dist
          tar -czvf dist/gtasks-gui-linux-x86_64.tar.gz -C target/release gtasks_gui
          tar -czvf dist/gtasks-tui-linux-x86_64.tar.gz -C target/release gtasks_tui

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*