[package]
name = "gtasks_core"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Core logic for Google Tasks TUI"
readme = "README.md"
repository = "https://github.com/MCR-Project/google-tasks-gui"



[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
dotenvy = "0.15"

# API Calls
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.53.1", features = ["full"] }
open = "5.4.0"
keyring = "2.1"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3"
tracing = "0.1"
thiserror = "1.0"

