[package]
name = "tasks-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
gtasks_core = { path = "../gtasks_core" }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
chrono = "0.4"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
egui_extras = { version = "0.37.0", features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
