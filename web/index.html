<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Tasks — Desktop Application</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Cantarell / Inter GNOME Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Cantarell', 'sans-serif'],
          },
          colors: {
            adw: {
              bg: '#1e1e1e',
              surface: '#242424',
              card: '#2d2d2d',
              border: '#383838',
              blue: '#3584e4',
              hover: '#383838',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #1e1e1e;
      color: #ffffff;
      user-select: none;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #383838; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #454545; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-[#3584e4] selection:text-white">

  <!-- GNOME Libadwaita HeaderBar -->
  <header class="h-14 bg-[#242424] border-b border-[#303030] px-4 flex items-center justify-between sticky top-0 z-30 shadow-md">
    <div class="flex items-center gap-3">
      <div class="w-7 h-7 rounded-lg bg-[#3584e4] flex items-center justify-center shadow-md">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
        </svg>
      </div>
      <div>
        <h1 class="text-xs font-bold text-white tracking-wide flex items-center gap-2">
          Tasks <span class="text-[10px] px-1.5 py-0.5 rounded bg-[#3584e4]/20 text-[#3584e4] font-medium border border-[#3584e4]/30">Libadwaita Desktop</span>
        </h1>
      </div>
    </div>

    <!-- Centered Header Title -->
    <div id="headerTitle" class="text-xs font-semibold text-zinc-300 hidden md:block">
      Google Tasks
    </div>

    <!-- Header Actions -->
    <div class="flex items-center gap-3">
      <div id="statusToast" class="hidden text-xs px-3 py-1 rounded-md bg-[#2d2d2d] text-zinc-300 border border-[#383838] flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-[#3584e4] animate-pulse"></span>
        <span id="statusToastMsg">Ready</span>
      </div>
      <button onclick="triggerSync()" id="syncBtn" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-[#3584e4] hover:bg-[#2a75d3] text-white transition-all flex items-center gap-1.5 shadow-md active:scale-95">
        <svg id="syncIcon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
        <span>Sync</span>
      </button>
    </div>
  </header>

  <!-- Main Libadwaita Content Split -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- Left Navigation Sidebar -->
    <aside class="w-64 bg-[#242424] border-r border-[#303030] p-3 flex flex-col justify-between">
      <div>
        <div class="flex items-center justify-between mb-3 px-2">
          <h2 class="text-[11px] font-bold uppercase tracking-wider text-zinc-400">Task Lists</h2>
          <button onclick="openNewListModal()" class="p-1 rounded-md hover:bg-[#383838] text-zinc-400 hover:text-white transition-colors" title="Create List">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          </button>
        </div>
        <div id="listsContainer" class="space-y-1">
          <!-- Dynamically populated lists -->
        </div>
      </div>

      <div class="p-3 rounded-lg bg-[#2d2d2d] border border-[#383838] text-[11px] text-zinc-400 space-y-1">
        <p class="font-semibold text-zinc-200">GNOME Libadwaita Integration</p>
        <p class="text-[10px] text-zinc-400">Native desktop app window backed by local SQLite & Google Tasks API.</p>
      </div>
    </aside>

    <!-- Center Task Workspace -->
    <main class="flex-1 overflow-y-auto p-6 max-w-3xl mx-auto w-full">
      
      <!-- List Title Header -->
      <div class="mb-5">
        <h2 id="currentListTitle" class="text-xl font-bold text-white tracking-tight">Select a Task List</h2>
        <p id="currentListSubtitle" class="text-xs text-zinc-400 mt-0.5">0 tasks</p>
      </div>

      <!-- Add New Task Input Bar -->
      <div class="mb-5 bg-[#2d2d2d] border border-[#383838] rounded-xl p-2.5 shadow-md focus-within:border-[#3584e4] transition-all">
        <form onsubmit="handleAddTask(event)" class="flex items-center gap-3">
          <div class="w-4 h-4 rounded-full border border-zinc-500 flex items-center justify-center"></div>
          <input type="text" id="newTaskInput" placeholder="+ Add a task (press Enter to save)..." class="bg-transparent text-white text-xs placeholder-zinc-500 focus:outline-none flex-1">
          <input type="date" id="newTaskDue" class="bg-[#1e1e1e] text-[11px] text-zinc-300 px-2.5 py-1 rounded-md border border-[#383838] focus:outline-none">
          <button type="submit" class="px-3 py-1 text-xs font-medium rounded-md bg-[#3584e4] hover:bg-[#2a75d3] text-white transition-colors">Add</button>
        </form>
      </div>

      <!-- Task Items Container -->
      <div id="tasksContainer" class="space-y-2">
        <!-- Dynamically populated task items -->
      </div>
    </main>

    <!-- Right Side Task Detail Drawer -->
    <aside id="taskDetailDrawer" class="w-80 border-l border-[#303030] bg-[#242424] p-5 hidden flex flex-col justify-between overflow-y-auto">
      <div>
        <div class="flex items-center justify-between pb-3 mb-4 border-b border-[#303030]">
          <h3 class="text-xs font-bold text-white flex items-center gap-2">
            <span>📝 Edit Task Details</span>
          </h3>
          <button onclick="closeDetailDrawer()" class="p-1 rounded-md text-zinc-400 hover:bg-[#383838] hover:text-white">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>

        <form id="editTaskForm" onsubmit="handleSaveTaskDetails(event)" class="space-y-3.5">
          <div>
            <label class="block text-[10px] font-bold uppercase text-zinc-400 mb-1">Title</label>
            <input type="text" id="editTitle" required class="w-full bg-[#1e1e1e] border border-[#383838] rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-[#3584e4]">
          </div>
          <div>
            <label class="block text-[10px] font-bold uppercase text-zinc-400 mb-1">Description / Notes</label>
            <textarea id="editNotes" rows="4" placeholder="Add description..." class="w-full bg-[#1e1e1e] border border-[#383838] rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-[#3584e4]"></textarea>
          </div>
          <div>
            <label class="block text-[10px] font-bold uppercase text-zinc-400 mb-1">Due Date</label>
            <input type="date" id="editDue" class="w-full bg-[#1e1e1e] border border-[#383838] rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-[#3584e4]">
          </div>
          <button type="submit" class="w-full py-2 text-xs font-semibold rounded-lg bg-[#3584e4] hover:bg-[#2a75d3] text-white shadow-md transition-colors">
            Save Details
          </button>
        </form>
      </div>

      <div id="editTaskMeta" class="pt-3 border-t border-[#303030] text-[10px] text-zinc-500 space-y-1">
        <p>Status: <span id="metaStatus" class="font-medium text-zinc-400">--</span></p>
        <p>Cloud Sync: <span id="metaSync" class="font-medium text-zinc-400">--</span></p>
      </div>
    </aside>

  </div>

  <!-- Create New List Modal -->
  <div id="newListModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs hidden flex items-center justify-center z-50">
    <div class="bg-[#2d2d2d] border border-[#383838] rounded-xl p-5 w-full max-w-sm shadow-2xl space-y-3">
      <h3 class="text-xs font-bold text-white">Create New Task List</h3>
      <input type="text" id="newListNameInput" placeholder="Enter list name..." class="w-full bg-[#1e1e1e] border border-[#383838] rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-[#3584e4]">
      <div class="flex items-center justify-end gap-2 pt-1">
        <button onclick="closeNewListModal()" class="px-3 py-1.5 text-xs font-semibold text-zinc-400 hover:text-white">Cancel</button>
        <button onclick="handleCreateList()" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-[#3584e4] hover:bg-[#2a75d3] text-white">Create</button>
      </div>
    </div>
  </div>

  <!-- Frontend JavaScript -->
  <script>
    let currentLists = [];
    let currentTasks = [];
    let activeListId = '';
    let selectedTaskId = '';

    document.addEventListener('DOMContentLoaded', () => {
      fetchLists();
    });

    function showToast(msg) {
      const toast = document.getElementById('statusToast');
      const toastMsg = document.getElementById('statusToastMsg');
      toastMsg.textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3500);
    }

    async function fetchLists() {
      try {
        const res = await fetch('/api/lists');
        const json = await res.json();
        if (json.success && json.data.length > 0) {
          currentLists = json.data;
          renderLists();
          if (!activeListId) {
            selectList(currentLists[0].id);
          }
        }
      } catch (err) {
        console.error('Failed to fetch lists:', err);
      }
    }

    function renderLists() {
      const container = document.getElementById('listsContainer');
      container.innerHTML = currentLists.map(list => {
        const isActive = list.id === activeListId;
        const activeClass = isActive 
          ? 'bg-[#3584e4] text-white font-medium shadow-sm' 
          : 'text-zinc-400 hover:bg-[#2d2d2d] hover:text-zinc-200';
        return `
          <button onclick="selectList('${list.id}')" class="w-full text-left px-3 py-2 rounded-lg text-xs flex items-center justify-between transition-all ${activeClass}">
            <div class="flex items-center gap-2 truncate">
              <span class="text-xs">📁</span>
              <span class="truncate">${list.title}</span>
            </div>
          </button>
        `;
      }).join('');
    }

    async function selectList(listId) {
      activeListId = listId;
      renderLists();
      const activeList = currentLists.find(l => l.id === listId);
      if (activeList) {
        document.getElementById('currentListTitle').textContent = activeList.title;
        document.getElementById('headerTitle').textContent = activeList.title;
      }
      fetchTasks(listId);
    }

    async function fetchTasks(listId) {
      try {
        const res = await fetch(`/api/lists/${listId}/tasks`);
        const json = await res.json();
        if (json.success) {
          currentTasks = json.data;
          document.getElementById('currentListSubtitle').textContent = `${currentTasks.length} tasks`;
          renderTasks();
        }
      } catch (err) {
        console.error('Failed to fetch tasks:', err);
      }
    }

    function renderTasks() {
      const container = document.getElementById('tasksContainer');
      if (currentTasks.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 border border-dashed border-[#383838] rounded-xl">
            <p class="text-xs text-zinc-500">No tasks in this list yet.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = currentTasks.map(task => {
        const isDone = task.is_completed;
        const isDirty = task.is_dirty;
        const dueStr = task.due ? task.due.substring(0, 10) : '';

        return `
          <div class="group bg-[#2d2d2d] hover:bg-[#333333] border border-[#383838] rounded-lg p-3 flex items-center justify-between transition-all">
            <div class="flex items-center gap-3 min-w-0 flex-1 cursor-pointer" onclick="openDetailDrawer('${task.id}')">
              <button onclick="event.stopPropagation(); toggleTask('${task.id}', ${!isDone})" class="w-4 h-4 rounded border ${isDone ? 'bg-[#3584e4] border-[#3584e4] text-white' : 'border-zinc-500 hover:border-[#3584e4]'} flex items-center justify-center transition-colors">
                ${isDone ? '✓' : ''}
              </button>
              <div class="min-w-0 flex-1">
                <p class="text-xs font-medium ${isDone ? 'line-through text-zinc-500' : 'text-zinc-200'} truncate">
                  ${task.title || '(No Title)'}
                </p>
                ${task.notes ? `<p class="text-[11px] text-zinc-500 truncate mt-0.5">${task.notes}</p>` : ''}
              </div>
            </div>

            <div class="flex items-center gap-2">
              ${dueStr ? `<span class="text-[10px] px-2 py-0.5 rounded bg-[#1e1e1e] text-zinc-400 border border-[#383838]">📅 ${dueStr}</span>` : ''}
              ${isDirty ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20" title="Unsynced local edit">⚡</span>` : ''}
              <button onclick="deleteTask('${task.id}')" class="p-1 rounded text-zinc-500 hover:bg-[#383838] hover:text-rose-400 transition-colors opacity-0 group-hover:opacity-100">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function handleAddTask(e) {
      e.preventDefault();
      const input = document.getElementById('newTaskInput');
      const dueInput = document.getElementById('newTaskDue');
      const title = input.value.trim();
      if (!title || !activeListId) return;

      try {
        const res = await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            list_id: activeListId,
            title: title,
            due: dueInput.value || null
          })
        });
        const json = await res.json();
        if (json.success) {
          input.value = '';
          dueInput.value = '';
          showToast('Task added!');
          fetchTasks(activeListId);
        }
      } catch (err) {
        console.error('Failed to add task:', err);
      }
    }

    async function toggleTask(taskId, newStatus) {
      try {
        const res = await fetch(`/api/tasks/${taskId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ is_completed: newStatus })
        });
        const json = await res.json();
        if (json.success) {
          fetchTasks(activeListId);
        }
      } catch (err) {
        console.error('Failed to toggle task:', err);
      }
    }

    async function deleteTask(taskId) {
      try {
        const res = await fetch(`/api/tasks/${taskId}`, { method: 'DELETE' });
        const json = await res.json();
        if (json.success) {
          showToast('Task deleted!');
          fetchTasks(activeListId);
        }
      } catch (err) {
        console.error('Failed to delete task:', err);
      }
    }

    function openDetailDrawer(taskId) {
      selectedTaskId = taskId;
      const task = currentTasks.find(t => t.id === taskId);
      if (!task) return;

      document.getElementById('editTitle').value = task.title || '';
      document.getElementById('editNotes').value = task.notes || '';
      document.getElementById('editDue').value = task.due ? task.due.substring(0, 10) : '';
      document.getElementById('metaStatus').textContent = task.is_completed ? 'Completed ✅' : 'Pending 🔲';
      document.getElementById('metaSync').textContent = task.is_dirty ? 'Unsynced Local Edit ⚡' : 'Synced Cloud ☁️';

      document.getElementById('taskDetailDrawer').classList.remove('hidden');
    }

    function closeDetailDrawer() {
      document.getElementById('taskDetailDrawer').classList.add('hidden');
    }

    async function handleSaveTaskDetails(e) {
      e.preventDefault();
      if (!selectedTaskId) return;

      const title = document.getElementById('editTitle').value.trim();
      const notes = document.getElementById('editNotes').value.trim();
      const due = document.getElementById('editDue').value;

      try {
        const res = await fetch(`/api/tasks/${selectedTaskId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: title,
            notes: notes || null,
            due: due || null
          })
        });
        const json = await res.json();
        if (json.success) {
          showToast('Task saved!');
          closeDetailDrawer();
          fetchTasks(activeListId);
        }
      } catch (err) {
        console.error('Failed to save task details:', err);
      }
    }

    async function triggerSync() {
      const btn = document.getElementById('syncBtn');
      const icon = document.getElementById('syncIcon');
      icon.classList.add('animate-spin');
      showToast('Syncing Google Tasks...');

      try {
        const res = await fetch('/api/sync', { method: 'POST' });
        const json = await res.json();
        if (json.success) {
          showToast('Synced with Google Tasks! ✅');
          await fetchLists();
          if (activeListId) {
            await fetchTasks(activeListId);
          }
        }
      } catch (err) {
        showToast('Sync warning');
      } finally {
        icon.classList.remove('animate-spin');
      }
    }

    function openNewListModal() {
      document.getElementById('newListNameInput').value = '';
      document.getElementById('newListModal').classList.remove('hidden');
    }

    function closeNewListModal() {
      document.getElementById('newListModal').classList.add('hidden');
    }

    async function handleCreateList() {
      const nameInput = document.getElementById('newListNameInput');
      const name = nameInput.value.trim();
      if (!name) return;

      try {
        const res = await fetch('/api/lists', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: name })
        });
        const json = await res.json();
        if (json.success) {
          closeNewListModal();
          showToast(`Task List '${name}' created!`);
          await fetchLists();
          if (json.data) {
            selectList(json.data.id);
          }
        }
      } catch (err) {
        console.error('Failed to create list:', err);
      }
    }
  </script>
</body>
</html>
